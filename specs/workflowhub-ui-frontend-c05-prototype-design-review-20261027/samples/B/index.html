<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实盘驾驶舱 · 原生静态研究样本</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head>
<body><nav aria-label="主导航"><a href="index.html">实盘驾驶舱</a><span>受控原型 · 合成数据 · 不连接平台，不发送真实交易</span></nav>
<aside class="prototype-controls" aria-label="样本状态与演示视角"><label>Mock 状态<select aria-label="Mock状态" id="scenario"></select></label><label>许可<select aria-label="Mock许可" id="permission"></select></label><label>演示视角<select aria-label="演示账户关系" id="role"><option value="leader">主账户视角（leader）</option><option value="follower">跟随账户视角（follower）</option></select></label><button id="reset">重置样本</button></aside>
<main><header class="page-header"><div><p class="eyebrow">LIVE OPERATIONS</p><h1>实盘驾驶舱</h1></div><div class="readback-lamp" role="status">读回 · 尚无命令</div></header><div class="tabs" role="tablist" aria-label="驾驶舱导航"><button role="tab" id="tab-品种监控" aria-controls="live-content">品种监控</button><button role="tab" id="tab-命令历史" aria-controls="live-content">命令历史 0</button><button role="tab" id="tab-台账" aria-controls="live-content">台账</button></div><div id="scenario-result"></div><div role="tabpanel" id="live-content"></div></main>
<dialog class="drawer" aria-labelledby="symbol-title"><header><h2 id="symbol-title"></h2><button data-action="close-detail" aria-label="关闭品种详情">关闭</button></header><div id="symbol-content"></div><footer><button disabled title="开仓不在本次四步受控任务范围">开仓（演示未接入）</button><button class="danger" data-action="open-confirm">单品种清仓</button></footer></dialog>
<dialog class="confirm" aria-labelledby="confirm-title"><header><h2 id="confirm-title">确认单品种清仓</h2><button data-action="cancel-confirm" aria-label="关闭确认">关闭</button></header><p id="consequence"></p><div class="table-scroll" role="region" tabindex="0" aria-label="本次确认账户范围"><table><caption id="scope-title"></caption><thead><tr><th>账户</th><th>关系</th><th>初始模拟持仓</th></tr></thead><tbody id="scope-accounts"></tbody></table></div><p class="muted">账户关系说明分组，不授予操作权限。本次仅按顶部选择的本地模拟许可与演示视角判定，未连接真实权限或交易服务。</p><label for="confirmation-word">输入「单品种清仓」确认</label><input id="confirmation-word" aria-label="确认文字" autocomplete="off"><footer><button data-action="cancel-confirm">取消</button><button class="danger" data-action="send" disabled>确认单品种清仓</button></footer></dialog>
</body></html>
