name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check
      # Metrics smoke
      - run: node_modules/.bin/vitest run tests/metrics-smoke.test.mjs --passWithNoTests=false
      # Verify-code smoke
      - run: node_modules/.bin/vitest run tests/verify-code-freshness.test.mjs tests/verify-code-facts.test.mjs --passWithNoTests=false
      - run: npm run test:contract
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:review
      - run: npm run test:close
      - run: npm run test:left-shift
      - run: npm run test:acceptance
      - run: npm run test:skills
      - run: npm run test:core
      - run: npm run test:root
      - run: npm run test:exclusive
