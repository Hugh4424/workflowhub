<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>给导出功能加上失败重试 · 流程追踪</title>
<style>
/* ============================================================
   基础：颜色、字体、重置（对应 src/index.css 的 @theme 与 preflight）
   ============================================================ */
:root{
  --page:#f5f6f8;
  --surface:#ffffff;
  --ink:#18212f;
  --sub:#596577;
  --line:#e3e7ed;
  --accent:#315ccb;
  --accent-soft:#eef3ff;
  --warm:#9a6508;
  --warm-soft:#fff4d9;
  --fail:#b53d42;
  --fail-soft:#fff0f0;
  --unk:#687486;
  --unk-soft:#f0f2f5;
  --ok:#277353;
  --ok-soft:#edf7f1;
  --sans:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', system-ui, sans-serif;
  --mono:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--sans);
  background:var(--page);
  color:var(--ink);
  font-size:14px;
  line-height:22px;
}
button{font:inherit;color:inherit;background:transparent;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
ol,ul{margin:0;padding:0;list-style:none}
p{margin:0}
h2,h3{margin:0;font-size:inherit;font-weight:inherit}
code{font-family:var(--mono)}
b{font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:#dbe5ff}
.scroll-thin{scrollbar-width:thin;scrollbar-color:#d3d9e2 transparent}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none;animation:none;scroll-behavior:auto}
}

/* 图标 */
.icon{display:block;flex-shrink:0}
.kt{color:var(--kc)}
.icon-white{color:#ffffff}
.chev{display:block;flex-shrink:0;transition:transform .15s}
.chev.is-open{transform:rotate(90deg)}

/* ============================================================
   外壳：页头 / 左右分栏 / 页脚
   ============================================================ */
.app{display:flex;height:100%;flex-direction:column;background:var(--page);color:var(--ink)}
.hdr{
  display:flex;min-height:64px;flex:0 0 auto;align-items:center;flex-wrap:wrap;gap:12px 20px;
  border-bottom:1px solid var(--line);background:var(--surface);padding:0 16px;
}
.hdr-task{min-width:0;flex:1 1 360px;padding:10px 0}
.hdr-task-name{overflow-wrap:anywhere;font-size:15px;font-weight:700;line-height:22px}
.hdr-task-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:12px;line-height:18px;color:var(--sub)}
.hdr-task-sub b{color:var(--ink)}
.hdr-stages{display:flex;align-items:center;gap:4px;flex-shrink:1}
.hdr-stages li{display:flex;align-items:center;gap:4px}
.hstage{border-radius:6px;padding:3px 10px;line-height:16px}
.hstage-k{font-size:10px;font-weight:500}
.hstage-n{font-size:13px;font-weight:600}
.hstage.is-done{background:var(--ok-soft);color:var(--ok)}
.hstage.is-now{background:var(--ink);color:#fff}
.hstage.is-todo{border:1px dashed #c4cbd6;color:var(--sub)}
.sep{color:var(--unk)}
.hdr-counts{font-size:12px;line-height:16px;color:var(--sub);flex-shrink:1}
.fail-strong{font-weight:500;color:var(--fail)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-live-label{font-size:12px;font-weight:500;color:var(--warm)}
.chip-live{
  display:inline-flex;height:24px;align-items:center;border-radius:4px;
  background:var(--warm-soft);padding:0 8px;font-size:12px;font-weight:500;color:var(--warm);
}
.chip-live:hover{text-decoration:underline}
.btn-seen{height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;font-weight:500}
.btn-seen:hover{background:var(--page)}
.hdr-readonly{font-size:12px;color:var(--sub)}

.body{position:relative;display:flex;min-height:0;flex:1}
.side{
  display:flex;flex-direction:column;min-height:0;width:340px;flex:0 0 auto;
  border-right:1px solid var(--line);background:var(--surface);
}
.side-nav{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 16px}
.scroller{min-width:0;flex:1;overflow-y:auto}
.main{max-width:980px;margin:0 auto;padding:20px 32px 64px;overflow-wrap:anywhere}
.foot{
  display:flex;height:32px;flex:0 0 auto;align-items:center;
  border-top:1px solid var(--line);background:var(--surface);padding:0 16px;
  font-size:12px;color:var(--sub);
}
.foot-label{flex-shrink:0;white-space:nowrap}.foot-dir{margin-left:auto;color:var(--unk);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================================================
   左栏目录
   ============================================================ */
.nav-progress{
  position:sticky;top:0;z-index:2;background:var(--surface);
  display:flex;min-height:36px;width:100%;align-items:center;gap:8px;
  border-radius:8px;padding:0 10px;font-size:14px;font-weight:600;color:var(--ink);
}
.nav-progress:hover{background:var(--page)}
.nav-progress.is-active{background:var(--ink);color:#fff}
.nav-progress .tag{margin-left:auto}
.nav-group{margin-top:16px}
.nav-group h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 4px}
.nav-count{font-size:12px;color:var(--sub)}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-note{margin:16px 0 0;padding:0 4px;font-size:12px;line-height:18px;color:var(--unk)}

.navrow{
  display:block;width:100%;border-radius:8px;border-left:3px solid transparent;
  padding:6px 10px;color:var(--ink);
}
.navrow:hover{background:var(--page)}
.navrow.is-related{border-left-color:var(--kc);background:rgba(238,243,255,.6)}
.navrow.is-related:hover{background:var(--accent-soft)}
.navrow.is-changed{border-left-color:var(--kc);background:var(--warm-soft)}
.navrow.is-active{border-left-color:var(--ink);background:var(--ink);color:#fff}
.navrow-main{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:21px}.navrow-main>.icon{margin-top:3px}.navrow-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:5px 0 0 23px;min-width:0}
.navrow-name{min-width:0;flex:1;overflow-wrap:anywhere;font-weight:600}
.navrow-hints{
  margin-top:2px;display:flex;flex-wrap:wrap;column-gap:12px;
  padding-left:23px;font-size:12px;line-height:16px;color:var(--sub);
}
.navrow.is-active .navrow-hints{color:rgba(255,255,255,.8)}
.navrow-hints .is-fail{font-weight:500;color:var(--fail)}
.nst{
  display:inline-flex;min-height:20px;max-width:100%;align-items:center;white-space:normal;overflow-wrap:anywhere;
  border-radius:3px;padding:0 6px;font-size:11px;font-weight:500;line-height:16px;
}
.nst.tone-ok{background:var(--ok-soft);color:var(--ok)}
.nst.tone-accent{background:var(--accent-soft);color:var(--accent)}
.nst.tone-fail{background:var(--fail-soft);color:var(--fail)}
.nst.tone-unk{background:var(--unk-soft);color:var(--unk)}
.nst.is-active{background:#fff;color:var(--ink)}

/* ============================================================
   标签 / 状态 / 类型 chip
   ============================================================ */
.tag{
  display:inline-flex;align-items:center;gap:4px;height:22px;flex-shrink:0;
  white-space:nowrap;border-radius:4px;padding:0 10px;font-size:12px;line-height:18px;
}
.tag:not(.sm){font-weight:500}
.tag.sm{height:18px;padding:0 6px;font-size:11px;line-height:16px}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-fail{background:var(--fail-soft);color:var(--fail)}
.tag-unk{background:var(--unk-soft);color:var(--unk)}
.tag-accent{background:var(--accent-soft);color:var(--accent)}
.tag-warm{background:var(--warm-soft);color:var(--warm)}

.chip{
  display:inline-flex;height:24px;flex-shrink:0;align-items:center;gap:4px;
  white-space:nowrap;border-radius:4px;padding:0 8px;
  font-size:12px;font-weight:600;line-height:18px;
}
.chip.soft{background:var(--ks);color:var(--kc)}
.chip-solid{background:var(--kc);color:#fff}
.chip-outline{border:1px solid var(--kc);background:#fff;color:var(--kc)}
.chip-dashed{border:1px dashed var(--kc);background:#fff;color:var(--kc);font-family:var(--mono)}

/* 状态文字色 */
.t-ok{color:var(--ok)}
.t-accent{color:var(--accent)}
.t-unk{color:var(--unk)}
.t-fail{color:var(--fail)}
.t-warm{color:var(--warm)}

/* ============================================================
   详情页：工具条 / Hero
   ============================================================ */
.toolbar{display:flex;min-height:32px;align-items:center;gap:12px;margin-bottom:16px}
.backbtn{height:32px;border-radius:6px;padding:0 4px;font-size:13px;color:var(--accent)}
.backbtn:hover{text-decoration:underline}
.page-h2{margin:0 0 20px;font-size:28px;font-weight:700;line-height:36px;outline-offset:4px}

.hero{
  border:1px solid var(--line);border-top:5px solid var(--kc);border-radius:12px;
  padding:24px;background:var(--surface);
}
.hero.is-changed{background:var(--warm-soft)}
.hero-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.hero-head>.tag{height:auto;min-height:22px;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.hero-phase{font-size:13px;font-weight:600;color:var(--kc)}
.hero h2{margin:0;font-weight:700;color:var(--ink);outline-offset:4px}
.h2-xl{font-size:26px;line-height:36px;text-wrap:pretty}
.h2-lg{font-size:22px;line-height:32px}
.h2-mono{font-family:var(--mono)}
.hero-quote{border-radius:8px;background:var(--ks);padding:20px}
.hero-quote-icon{display:block;margin-bottom:4px;color:var(--kc)}
.hero-note{margin-top:12px;font-size:13px;line-height:22px;color:var(--sub)}
.hero-note.small{font-size:12px}
.hero-finding{margin-top:16px;border-radius:8px;background:var(--ks);padding:16px}
.finding-k{font-size:12px;font-weight:600;color:var(--kc)}
.finding-v{margin:0;font-size:18px;font-weight:600;line-height:28px;color:var(--ink)}
.hero-grid{margin-top:16px;display:grid;gap:12px;grid-template-columns:1fr}
.hero-cell{border-radius:8px;padding:16px}
.hero-cell.soft{background:var(--ks)}
.hero-cell.page{background:var(--page)}
.cell-k{font-size:12px;font-weight:600;color:var(--kc)}
.cell-k.sub{color:var(--sub)}
.cell-v{margin:0;font-size:16px;font-weight:600;line-height:24px;color:var(--ink)}
.cell-v-sm{margin:0;font-size:15px;line-height:24px;color:var(--ink)}
.hero-file-note{margin-top:12px;font-size:16px;line-height:24px;color:var(--ink)}
.hero-summary{margin-top:8px;font-size:16px;line-height:26px;color:var(--ink)}
.stats{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px}
.stat{min-width:116px;border-radius:10px;padding:12px 16px}
.stat-ok{background:var(--ok-soft);color:var(--ok)}
.stat-fail{background:var(--fail-soft);color:var(--fail)}
.stat-unk{background:var(--unk-soft);color:var(--unk)}
.stat-row{display:flex;align-items:baseline;gap:6px}
.stat-icon{font-size:14px;font-weight:700}
.stat-num{font-size:34px;font-weight:700;line-height:40px}
.stat-label{font-size:13px;font-weight:600}
.hero-explain{margin-top:16px;font-size:15px;line-height:24px;color:var(--ink)}

/* 两份记录对不上 */
.contra{margin-top:24px;border:1px solid rgba(181,61,66,.4);border-radius:10px;background:var(--surface);padding:16px}
.contra-head{display:flex;align-items:center;gap:6px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--fail)}
.contra-grid{display:grid;gap:12px;grid-template-columns:1fr}
.contra-cell{border-radius:8px;padding:12px}
.contra-cell.soft{background:var(--unk-soft)}
.contra-cell.fail{background:var(--fail-soft)}
.contra-k{font-size:12px;color:var(--sub)}
.contra-cell.fail .contra-k{color:var(--fail)}
.contra-v{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.contra-cell.fail .contra-v{color:var(--fail)}

/* ============================================================
   逻辑链条
   ============================================================ */
.chain{margin-top:36px}
.chain h3{margin:0 0 4px;font-size:18px;font-weight:600;line-height:28px;color:var(--ink)}
.chain .lead{margin:0 0 20px;font-size:13px;line-height:22px;color:var(--sub)}
.chain ol{list-style:none;margin:0;padding:0}
.lane{display:flex;gap:16px}
.lane-rail{display:flex;width:40px;flex:0 0 auto;flex-direction:column;align-items:center}
.lane-dot{
  display:flex;height:40px;width:40px;align-items:center;justify-content:center;
  border-radius:999px;background:var(--kc);color:#fff;
}
.lane-dot.is-cur{box-shadow:0 0 0 4px rgba(24,33,47,.15)}
.lane-line{margin-top:4px;width:2px;flex:1;background:#c9d0db}
.lane-body{min-width:0;flex:1}
.lane:not(:last-child) .lane-body{padding-bottom:24px}
.lane-head{display:flex;min-height:40px;align-items:center;gap:8px;margin-bottom:8px}
.lane-label{font-size:15px;font-weight:700;color:var(--kc)}
.lane-count{font-size:12px;color:var(--sub)}
.lane-pos{
  margin-left:auto;border-radius:4px;padding:0 6px;
  font-size:11px;font-weight:500;line-height:20px;
  background:var(--unk-soft);color:var(--unk);
}
.lane-pos.is-cur{background:var(--ink);color:#fff}
.lane-items{display:flex;flex-direction:column;gap:8px}

.gapbox{
  display:flex;align-items:flex-start;gap:4px;border-radius:6px;
  border:1px dashed rgba(181,61,66,.6);background:var(--fail-soft);
  padding:6px 8px;font-size:12px;font-weight:500;line-height:18px;color:var(--fail);
}
.gapbox .icon{margin-top:2px}
.emptybox{
  border-radius:6px;border:1px dashed #c4cbd6;background:var(--unk-soft);
  padding:16px;font-size:14px;line-height:22px;color:var(--sub);
}

/* ============================================================
   卡片 / 文件折叠 / 计划文件
   ============================================================ */
.objcard{
  display:flex;width:100%;align-items:center;gap:12px;
  border:1px solid var(--line);border-left:5px solid var(--kc);border-radius:8px;
  padding:12px 16px;background:var(--surface);text-align:left;
  box-shadow:0 1px 0 rgba(24,33,47,.04);
}
.objcard:hover{border-right-color:rgba(24,33,47,.3);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.objcard.is-changed{
  border-top-color:rgba(154,101,8,.3);border-right-color:rgba(154,101,8,.3);
  border-bottom-color:rgba(154,101,8,.3);background:var(--warm-soft);
}
.objcard.is-current{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.objcard-icon{
  display:flex;height:36px;width:36px;flex:0 0 auto;align-items:center;justify-content:center;
  border-radius:8px;background:var(--ks);color:var(--kc);
}
.objcard-icon.task-icon{background:var(--kc);color:#fff}
.objcard-body{min-width:0;flex:1}
.objcard-label{display:block;font-size:11px;font-weight:600;line-height:16px;color:var(--kc)}
.objcard-title{display:block;font-size:15px;font-weight:600;line-height:22px;color:var(--ink)}
.objcard-title.mono{font-family:var(--mono);font-size:14px}
.objcard-line{display:block;font-size:13px;line-height:20px;color:var(--sub)}
.objcard-cur{
  flex:0 0 auto;border-radius:4px;background:var(--ink);padding:0 8px;
  font-size:12px;font-weight:600;line-height:20px;color:#fff;
}

.objchip{
  display:flex;width:100%;flex-direction:column;align-items:flex-start;gap:2px;
  border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:6px;
  padding:6px 8px;background:var(--surface);text-align:left;
}
.objchip:hover{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.objchip.is-changed{
  border-top-color:var(--line);border-right-color:var(--line);border-bottom-color:var(--line);
  background:var(--warm-soft);
}
.objchip.is-current{
  background:#fff;border-top-color:transparent;border-right-color:transparent;
  border-bottom-color:transparent;box-shadow:0 0 0 2px var(--kc);
}
.objchip-top{display:flex;width:100%;align-items:center;gap:6px}
.objchip-name{min-width:0;flex:1;font-size:12.5px;font-weight:600;line-height:18px;color:var(--ink)}
.objchip-name.mono{font-family:var(--mono);font-size:12px}
.objchip-status{display:flex;align-items:center;gap:4px;padding-left:19px;font-size:11px;font-weight:500;line-height:16px}

.filefold{border:1px solid var(--line);border-left:5px solid var(--kc);border-radius:8px;background:var(--surface)}
.filefold-head{display:flex;width:100%;align-items:center;gap:12px;padding:12px 16px;text-align:left}
.filefold-icon{
  display:flex;height:36px;width:36px;flex:0 0 auto;align-items:center;justify-content:center;
  border-radius:8px;background:var(--ks);color:var(--kc);
}
.filefold-title{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
.filefold-hint{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.filefold-body{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding:12px}

.planbtn{
  display:flex;align-items:center;gap:8px;border:1px dashed var(--kc);border-radius:6px;
  background:var(--surface);padding:8px 12px;font-size:14px;font-weight:500;color:var(--ink);
}
.planbtn .hint{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:400;color:var(--sub)}
.planlist{display:flex;flex-wrap:wrap;gap:8px}
.planchip{
  display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--kc);border-radius:4px;
  background:var(--surface);padding:4px 8px;font-family:var(--mono);font-size:12px;color:var(--sub);
}
.planchip .note{font-family:var(--sans);font-size:11px;color:var(--unk)}

/* ============================================================
   分区 / 步骤 / 失败项 / 来源
   ============================================================ */
.section{margin-top:36px}
.section-title{
  display:flex;align-items:baseline;gap:8px;margin:0 0 12px;
  font-size:17px;font-weight:600;line-height:24px;color:var(--ink);
}
.section-title .count{font-size:13px;font-weight:400;color:var(--sub)}
.section-title .hint{font-size:12px;font-weight:400;color:var(--unk)}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:20px}
.panel.flush{padding:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:flex-start;gap:12px;font-size:15px;line-height:24px;color:var(--ink)}
.step-num{
  margin-top:2px;display:flex;height:20px;width:20px;flex:0 0 auto;align-items:center;justify-content:center;
  border-radius:4px;background:var(--ks);color:var(--kc);font-size:12px;font-weight:600;
}
.failitem{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid rgba(181,61,66,.4);
  border-radius:8px;background:var(--fail-soft);padding:12px 16px;color:var(--fail);
}
.mono13{font-family:var(--mono);font-size:13px}
.failitem .msg{font-size:13px;font-weight:500}

.sources{margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
.src-toggle{display:flex;align-items:center;gap:6px;border-radius:3px;font-size:12px;color:var(--sub)}
.src-toggle:hover{color:var(--ink)}
.src-body{margin-top:8px;font-size:13px}
.srow{border-bottom:1px solid rgba(227,231,237,.7);padding:8px 0}
.srow:last-child{border-bottom:0}
.srow-head{
  display:flex;width:100%;flex-wrap:wrap;align-items:baseline;gap:0 8px;
  border-radius:3px;font-size:14px;line-height:22px;text-align:left;
}
.srow-head:hover{background:rgba(240,242,245,.7)}
.srow-head .k{font-weight:600}
.srow-head .dot{color:var(--sub)}
.mono12{font-family:var(--mono);font-size:12px;line-height:18px;color:var(--sub);word-break:break-all}
.ml1{margin-left:4px}
.srow-body{
  margin-top:8px;border:1px dashed #c4cbd6;border-radius:6px;background:var(--unk-soft);
  padding:12px;font-size:13px;line-height:20px;color:var(--sub);
}
.srow-body p{margin:0}
.srow-body .p2{margin-top:4px}
.mono-ink{font-family:var(--mono);font-size:12px;line-height:18px;color:var(--ink);word-break:break-all;user-select:all}

/* ============================================================
   进度总览
   ============================================================ */

    return '<div class="' + wrap + '">' + head +
      '' +

        '<span class="hero-quote-icon">' + icon('req', 28) + '</span>' +

      '</div>' +
      (o.summary && o.summary !== o.title ? '<p class="hero-summary">'+esc(o.summary)+'</p>' : '') +
      (o.acceptance ? '<p class="hero-note">代码验收：'+esc(o.acceptance.text.replace(/^代码验收/,''))+(o.acceptance.reason?'<span class="info-tip acceptance-info"><button type="button" aria-label="代码验收适用说明" aria-describedby="'+esc(o.id)+'-acceptance-tip"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7v4M8 4.5v1"/></svg></button><span role="tooltip" id="'+esc(o.id)+'-acceptance-tip">'+esc(o.acceptance.reason)+'</span></span>':'')+'</p>':'') +
      (indexed ? '<details class="raw-quote"><summary>用户原话 · '+esc(o.source || '来源未取得')+'</summary><p>'+esc(o.quote || '原话未取得')+'</p></details>' : o.source ? '<p class="hero-note">'+esc(o.source)+'</p>' : '') +
    '</div>';
  }
  if (o.kind === 'ires' || o.kind === 'eres') {
    return '<div class="' + wrap + '">' + head + title('h2-lg', o.title) +
      '<div class="hero-finding">' +
        '<div class="finding-k">调研结论</div>' +
        '<p class="finding-v">' + esc(o.finding || '调研结论未取得') + '</p>' +
      '</div>' +
      '<p class="hero-note small">' +
        (o.origin ? esc(o.origin) : '来源指针 · 未抓取外部原文') +
      '</p>' +
    '</div>';
  }
  if (o.kind === 'dec') {
    return '<div class="' + wrap + '">' + head + title('h2-xl', o.title) +
      '<div class="hero-grid">' +
        '<div class="hero-cell soft"><div class="cell-k">决定了什么</div><p class="cell-v">' + esc(o.detail || '细节未取得') + '</p></div>' +
        '<div class="hero-cell page"><div class="cell-k sub">为什么这样定</div><p class="cell-v-sm">' + esc(o.why || '决定理由未取得') + '</p></div>' +
      '</div>' +
    '</div>';
  }
  if (o.kind === 'file') {
    return '<div class="' + wrap + '">' + head + title('h2-lg h2-mono', o.title) +
      '<p class="hero-file-note">' + esc(o.note || o.summary || '文件说明未取得；请查阅真实 diff') + '</p>' +
    '</div>';
  }
  if (o.kind === 'test') {
    const post = Number.isFinite(o.pass);
    const stats = post
      ? [
          { n: o.pass, label: '通过', tone: 'ok', sign: '✓' },
          { n: o.fail, label: '失败', tone: 'fail', sign: '✕' },
          { n: o.exit === undefined ? '未知' : o.exit, label: '退出码', tone: 'unk', sign: '#' },
        ]
      : [
          { n: o.fail === undefined ? '未知' : o.fail, label: '失败数（沿原件）', tone: 'unk', sign: '–' },
          { n: o.exit === undefined ? '未知' : o.exit, label: '退出码', tone: 'unk', sign: '#' },
        ];
    return '<div class="' + wrap + '">' + head + title('h2-xl', o.title) +
      '<div class="stats">' + stats.map(function (s) {
        return '<div class="stat stat-' + s.tone + '">' +
          '<div class="stat-row"><span class="stat-icon" aria-hidden="true">' + s.sign + '</span>' +
          '<span class="stat-num">' + s.n + '</span></div>' +
          '<div class="stat-label">' + esc(s.label) + '</div>' +
        '</div>';

      '<p class="hero-explain">' + esc(o.explain || o.summary || '测试解释未取得；结果以原件为准') + '</p>' +

  return '<div class="' + wrap + '">' + head + title('h2-xl', o.title) +
    (summary && summary !== o.title ? '<p class="hero-summary">' + esc(summary) + '</p>' : '') +

 const materialIds=IDS.filter(function(id){return OBJ[id].scope==='task';});

/* 来源与路径 */

  const cur = OBJ[id].kind === 'phase' ? '' : id;

  return '<section class="section"><h3 class="section-title">风险与未决来源全表</h3><p class="hero-note">'+esc(inv.note)+'</p>'+sections.map(function(row){
    const ids=row[1]||[];

  }).join('')+'<p class="hero-note">等级分布：'+esc(JSON.stringify(inv.riskSeverity))+'；未决表源状态分布：'+esc(JSON.stringify(inv.issueSourceStatus))+'。分类是来源读回，不是关闭裁决。</p></section>';

/* 页头 / 主区 */
function taskCounts() {
  const c = { total: 0 };
  DATA.objects.filter(function (x) { return x.kind === 'task'; }).forEach(function (t) {
    c.total += 1;
    const k = (t.status && t.status.text) || '未知';
    c[k] = (c[k] || 0) + 1;

function headerRightHtml() {
  const live = DATA.changedChips.filter(function (c) { return CHANGED.has(c.id); });

      '<div class="hstage is-' + st.state + '"' + (st.state === 'now' ? ' aria-current="step"' : '') + '>' +

function mainHtml() {

  const toolbar = '<div class="toolbar">' + back + '</div>';
  if (sel === 'progress') {
    return toolbar+'<h2 tabindex="-1" class="page-h2">进度总览</h2>'+progressHtml()+materialIssueHtml()+taskMaterialsHtml()+
      '<details class="task-materials"><summary>来源指纹与本次状态</summary><p>'+esc(DATA.rings ? (/报告 sha256=[a-f0-9]{64}(?![a-f0-9])/i.test(DATA.provenance||'') && /decision-log sha256=[a-f0-9]{64}(?![a-f0-9])/i.test(DATA.provenance||'') ? DATA.provenance : '缺口：报告或decision-log指纹未取得') : '报告缺失：final-chain-report.json 未取得')+'</p></details>';

<script>
/* 4. 状态与交互 */
const hdr = document.getElementById('hdr');
const sideNav = document.getElementById('side-nav');
const side = document.getElementById('side');
const scroller = document.getElementById('scroller');
const main = document.getElementById('main');
const ui = { sources: new Set(), plan: false, fileFold: false, srcRows: new Set() };
let storageError = '';
function seenKey(id) {
  const o = OBJ[id] || RING_BY_ID[id];
  if (typeof DATA.taskIdentity !== 'string' || !DATA.taskIdentity.trim()
    || !o || typeof o.contentDigest !== 'string' || !o.contentDigest.trim()) {
    throw new Error('缺少任务身份或节点内容摘要，已读状态不能持久保存');
  }
  return 'workflowhub:page-seen:' + JSON.stringify([DATA.taskIdentity, id, o.contentDigest]);
}
const CHANGED = new Set((DATA.initialChanged || []).filter(function (id) {
  if (!OBJ[id] && !RING_BY_ID[id]) return false;
  try { return localStorage.getItem(seenKey(id)) !== 'seen'; }
  catch (error) { storageError = '显示偏好不可读，刷新后的已读状态未知：' + error.message; return true; }
}));
let sel = Object.prototype.hasOwnProperty.call(OBJ,DATA.initialSelection) ? DATA.initialSelection : 'progress';
let focusId = sel==='progress'?null:sel;
let hist = [];
let scrolls = {};
let RELATED = new Set();
/* 用 DATA.kinds 里的颜色生成 15 个 kind 的 CSS 变量 */
(function injectKindStyles() {
  const css = Object.keys(DATA.kinds).map(function (k) {
    const v = DATA.kinds[k];
    return '.k-' + k + '{--kc:' + v.color + ';--ks:' + v.soft + '}';
  }).join('\n');
  const styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);
})();
function resetViewUi() {
  ui.sources = new Set();
  ui.plan = false;
  ui.srcRows = new Set();
  let fileIds = [];
  if (sel !== 'progress' && OBJ[sel]) {
    const lane = chainFor(sel).filter(function (l) { return l.kind === 'file'; })[0];
    fileIds = lane ? lane.items : [];
  }
  ui.fileFold = fileIds.indexOf(sel) >= 0;
}
function renderAll() {
  const sideTop = sideNav.scrollTop;
  RELATED = focusedObjectId() ? relatedObjectIds(focusedObjectId()) : new Set();
  hdr.innerHTML = headerHtml();
  sideNav.innerHTML = sidebarHtml();
  main.innerHTML = mainHtml();
  sideNav.scrollTop = sideTop;
}
function renderMain() {
  main.innerHTML = mainHtml();
}
function focusHeading() {
  const h = main.querySelector('h2');
  if (h) h.focus({ preventScroll: true });
}
function go(id) {
  if (RING_BY_ID[id]) { sel = 'progress'; renderAll(); const target=main.querySelector('[data-report-ring="'+id.slice(5)+'"]'); if(target) target.scrollIntoView(); return; }
  if (id === sel) return;
  scrolls[sel] = scroller.scrollTop;
  hist.push(sel);
  sel = id;
  if(OBJ[id])focusId=id;
  resetViewUi();
  renderAll();
  scroller.scrollTop = 0;
  focusHeading();
}
function goBack() {
  const prev = hist[hist.length - 1];
  if (!prev) return;
  scrolls[sel] = scroller.scrollTop;
  hist.pop();
  sel = prev;
  if(OBJ[prev])focusId=prev;
  resetViewUi();
  renderAll();
  scroller.scrollTop = scrolls[prev] || 0;
  focusHeading();
}
function handleToggle(el) {
  const kind = el.dataset.toggle;
  if (kind === 'sources') {
    const owner = el.dataset.owner;
    if (ui.sources.has(owner)) ui.sources.delete(owner); else ui.sources.add(owner);
  }
  else if (kind === 'plan') ui.plan = !ui.plan;
  else if (kind === 'filefold') ui.fileFold = !ui.fileFold;
  else if (kind === 'srcrow') {
    const key = el.dataset.owner + '-' + el.dataset.idx;
    if (ui.srcRows.has(key)) ui.srcRows.delete(key);
    else ui.srcRows.add(key);
  }
  renderMain();
  const selector = (kind === 'srcrow' || kind === 'sources')
    ? '[data-toggle="' + kind + '"][data-owner="' + el.dataset.owner + '"]' + (kind === 'srcrow' ? '[data-idx="' + el.dataset.idx + '"]' : '')
    : '[data-toggle="' + kind + '"]';
  const again = main.querySelector(selector);
  if (again) again.focus();
}
document.addEventListener('click', function (e) {
  const seen = e.target.closest('[data-seen]');
  if (seen) {
    storageError = '';
    Array.from(CHANGED).forEach(function (id) {
      try { localStorage.setItem(seenKey(id), 'seen'); CHANGED.delete(id); }
      catch (error) { storageError = '本次清除未持久保存：' + error.message; }
    });
    renderAll(); return;
  }
  const back = e.target.closest('[data-back]');
  if (back) { goBack(); return; }
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) { handleToggle(toggle); return; }
  const overview=e.target.closest('[data-overview-select]');
  if(overview){focusId=overview.dataset.overviewSelect;sel='progress';renderAll();return;}
  const nav = e.target.closest('[data-go]');
  if (nav) { go(nav.dataset.go); return; }
});
side.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const items = Array.from(sideNav.querySelectorAll('[data-nav]'));
  const i = items.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const n = items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
  items.forEach(function (x) { x.tabIndex = -1; });
  n.tabIndex = 0;
  n.focus();
});
document.getElementById('foot-dir').textContent = '数据来自 ' + DATA.sourceDir;
resetViewUi();
renderAll();
</script>
</body>
</html>
