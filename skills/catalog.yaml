# 来源权威为skills[].upstream/local_changes；正文与小卡仅非权威指针。
# 未核项由knowledge-graph方法维护者取graphify同版原法/许可；frontend-component-quality来源维护者取固定许可绑定；ui-project-init接线owner向交互状态权利owner取固定grant；取得前不扩复制/分发。
# 手动上游核对：仅维护者点名时只读执行，默认不跑、不自动更新。
# 1. 取登记的来源类型、真实仓库/取回坐标、采用pin和本次ref；先读目标，缺项不猜URL/commit。
#    同Git repo/ref共用一次当前观测，各采用pin/路径分别比；本地/无历史包仅核归档指纹与取回坐标，取不到记unavailable及原因，不造Git历史。
# 2. git ls-remote https://github.com/mattpocock/skills.git HEAD
#    留cwd/argv/来源ref/时点/exit及完整stdout/stderr唯一原件；exit0仍核有效ref坐标。
# 3. 分报当前坐标对采用pin、先前同源同ref观测对当前坐标；无前观测只报当前/采用差异，不判上游变或未变。
#    坐标不同不证祖先前进；取回不证本地同步、方法效果、许可或归档到commit身份。
# 4. 查不到/未知/无版本历史/不适用/未变分报，错误原样保留；权限/登录/输入非法/资源不存在等不可重试失败首现零重试，仅停该路径，其余安全读取继续。
# 5. 仅当次进程复放断网：git -c http.proxy=http://127.0.0.1:1 ls-remote https://github.com/mattpocock/skills.git HEAD
#    保真实非零/错误，不改系统代理；连接失败不冒目标RED或上游未变。
# 6. 核对只产观测/比较；采用pin、来源、review日期、许可、状态及文件字节更新由原owner按真实授权决定。
# capability_decisions旧AgentHub MIT是历史声称；当前更正信projects.agenthub与THIRD_PARTY_NOTICES.md。
