stage: build-plan
skills:
  - { name: spec-research, path: skills/spec-research/SKILL.md, execution: independent, invocation: always, trigger: in_memory_research, bundle: skills/spec-research/skill-bundle.json }
  - { name: simplicity-guard, path: skills/simplicity-guard/SKILL.md, execution: independent, invocation: always, trigger: scope_check, bundle: skills/simplicity-guard/skill-bundle.json }
  - { name: spec-plan, path: skills/spec-plan/SKILL.md, execution: inline, invocation: always, trigger: planning, bundle: skills/spec-plan/skill-bundle.json }
  - { name: spec-tasks, path: skills/spec-tasks/SKILL.md, execution: inline, invocation: always, trigger: task_breakdown, bundle: skills/spec-tasks/skill-bundle.json }
  - { name: spec-analyze, path: skills/spec-analyze/SKILL.md, execution: independent, invocation: always, trigger: consistency_review, bundle: skills/spec-analyze/skill-bundle.json }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, invocation: always, trigger: review, bundle: skills/wh-review/skill-bundle.json }
  - { name: plan-eng-review, path: skills/plan-eng-review/SKILL.md, execution: independent, invocation: conditional, trigger: wh_review_engineering_lens, bundle: skills/plan-eng-review/skill-bundle.json }
  - { name: review, path: skills/review/SKILL.md, execution: independent, invocation: conditional, trigger: wh_review_detail_lens, bundle: skills/review/skill-bundle.json }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: blocked }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: blocked }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: blocked }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: research_or_review, absence_semantics: blocked }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: research_or_review, absence_semantics: human_required }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
