stage: build-plan
skills:
  - { name: spec-research, path: skills/spec-research/SKILL.md, execution: independent, invocation: always, trigger: in_memory_research, bundle: skills/spec-research/skill-bundle.json }
  - { name: spec-plan, path: skills/spec-plan/SKILL.md, execution: inline, invocation: always, trigger: plan_design, bundle: skills/spec-plan/skill-bundle.json }
  - { name: spec-tasks, path: skills/spec-tasks/SKILL.md, execution: inline, invocation: always, trigger: task_design, bundle: skills/spec-tasks/skill-bundle.json }
  - { name: test-routing-advisor, path: skills/test-routing-advisor/SKILL.md, execution: independent, invocation: always, trigger: task_test_design, bundle: skills/test-routing-advisor/skill-bundle.json }
  - { name: testing-system-blueprint, path: skills/testing-system-blueprint/SKILL.md, execution: inline, invocation: always, trigger: task_test_blueprint, bundle: skills/testing-system-blueprint/skill-bundle.json }
  - { name: backend-testing, path: skills/backend-testing/SKILL.md, execution: independent, invocation: conditional, trigger: backend_test_design, bundle: skills/backend-testing/skill-bundle.json }
  - { name: frontend-testing, path: skills/frontend-testing/SKILL.md, execution: independent, invocation: conditional, trigger: frontend_test_design, bundle: skills/frontend-testing/skill-bundle.json }
  - { name: fullstack-slice-testing, path: skills/fullstack-slice-testing/SKILL.md, execution: independent, invocation: conditional, trigger: fullstack_test_design, bundle: skills/fullstack-slice-testing/skill-bundle.json }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, invocation: always, trigger: review, bundle: skills/wh-review/skill-bundle.json }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: blocked }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: blocked }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: blocked }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: research_or_review, absence_semantics: blocked }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: research_or_review, absence_semantics: diagnostic }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
