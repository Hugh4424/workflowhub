stage: build-plan
skills:
  - { name: spec-research, path: skills/spec-research/SKILL.md, execution: independent, trigger: real_research_question, bundle: skills/spec-research/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#testFacts", inputs: ["receipts.research"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.research" } }
  - { name: spec-plan, path: skills/spec-plan/SKILL.md, execution: inline, trigger: plan_design, bundle: skills/spec-plan/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-plan\")", inputs: ["artifacts.plan.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.plan_ref" } }
  - { name: simplicity-guard, path: skills/simplicity-guard/SKILL.md, execution: inline, trigger: simplicity_check, bundle: skills/simplicity-guard/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.review" } }
  - { name: plan-eng-review, path: skills/plan-eng-review/SKILL.md, execution: inline, trigger: engineering_plan_check, bundle: skills/plan-eng-review/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.review" } }
  - { name: testing-system-blueprint, path: skills/testing-system-blueprint/SKILL.md, execution: inline, trigger: phase_test_design, bundle: skills/testing-system-blueprint/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-plan\")", inputs: ["artifacts.plan.md", "artifacts.tasks.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.test_strategy" } }
  - { name: frontend-component-quality, path: skills/frontend-component-quality/SKILL.md, execution: inline, trigger: ui_scope, bundle: skills/frontend-component-quality/skill-bundle.json, owner: stage, consumer: { target: "stage-content-contracts#validateComponentQualityMap", inputs: ["contract_facts.component_quality_map"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.component_quality" } }
  - { name: test-routing-advisor, path: skills/test-routing-advisor/SKILL.md, execution: independent, trigger: task_test_routing, bundle: skills/test-routing-advisor/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-plan\")", inputs: ["artifacts.plan.md", "artifacts.tasks.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.test_routing" } }
  - { name: spec-tasks, path: skills/spec-tasks/SKILL.md, execution: inline, trigger: task_design, bundle: skills/spec-tasks/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-plan\")", inputs: ["artifacts.tasks.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.tasks_ref" } }
  - { name: spec-analyze, path: skills/spec-analyze/SKILL.md, execution: inline, trigger: stage_end_consistency, bundle: skills/spec-analyze/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#validateStageSpecAnalyzeOutcome", inputs: ["stage_outcome.spec_analyze"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_outcome.spec_analyze" } }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, trigger: review, bundle: skills/wh-review/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.review" } }
  - { name: stage-reflection, path: skills/stage-reflection/SKILL.md, execution: inline, trigger: on_stage_end, bundle: skills/stage-reflection/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#runStageEndReflection", inputs: ["stage_outcome.step_outcomes", "stage_outcome.skill_outcomes"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_reflection" } }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: diagnostic }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: diagnostic }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: diagnostic }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: research_or_review, absence_semantics: diagnostic }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: research_or_review, absence_semantics: diagnostic }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
