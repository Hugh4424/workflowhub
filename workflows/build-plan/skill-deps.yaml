stage: build-plan
skills:
  - name: deep-research
    path: skills/deep-research/SKILL.md
    trigger: real_research_question
  - name: spec-clarify
    path: skills/spec-clarify/SKILL.md
    trigger: material_specification_ambiguity
  - name: spec-specify
    path: skills/spec-specify/SKILL.md
    trigger: product_spec_authoring
  - name: spec-plan
    path: skills/spec-plan/SKILL.md
    trigger: plan_design_and_pure_pointer_index
  - name: simplicity-guard
    path: skills/simplicity-guard/SKILL.md
    trigger: simplicity_check
  - name: plan-eng-review
    path: skills/plan-eng-review/SKILL.md
    trigger: engineering_plan_check
  - name: testing-system-blueprint
    path: skills/testing-system-blueprint/SKILL.md
    trigger: phase_test_design
  - name: frontend-component-quality
    path: skills/frontend-component-quality/SKILL.md
    trigger: ui_scope
  - name: test-routing-advisor
    path: skills/test-routing-advisor/SKILL.md
    trigger: task_test_routing
  - name: spec-analyze
    path: skills/spec-analyze/SKILL.md
    trigger: stage_end_consistency
  - name: wh-review
    path: skills/wh-review/SKILL.md
    trigger: review
  - name: stage-handoff
    path: skills/stage-handoff/SKILL.md
    trigger: stage_end_human_handoff
  - name: ui-project-init
    path: skills/ui-project-init/SKILL.md
    trigger: ui_scope_existing_project_baseline
  - name: design-source-readiness
    path: skills/design-source-readiness/SKILL.md
    trigger: ui_scope_readable_design_sources
  - name: frontend-prototype-render
    path: skills/frontend-prototype-render/SKILL.md
    trigger: ui_scope_actual_prototype_preview
  - name: plan-design-review
    path: skills/plan-design-review/SKILL.md
    trigger: ui_scope_design_lens_in_merged_review
  - name: stage-reflection
    path: skills/stage-reflection/SKILL.md
    trigger: actual_stage_end_process_issue_optional
runtime_capabilities:
  - id: node
    kind: cli
    version_policy: '>=24'
    doctor:
      - node
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: shell
    kind: cli
    doctor:
      - sh
      - '-c'
      - exit 0
    required_when: always
    absence_semantics: diagnostic
  - id: git
    kind: cli
    doctor:
      - git
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: process
    kind: cli
    doctor:
      - ps
      - '-p'
      - '1'
    required_when: research_or_review
    absence_semantics: diagnostic
external_capabilities:
  - id: ocr-cli
    kind: cli
    version_policy: '>=1.12.9'
    doctor:
      - ocr
      - '--version'
    required_when: code_review
    absence_semantics: diagnostic
  - id: host-subagent
    kind: host
    doctor:
      - host-capability
      - host-subagent
    required_when: research_or_review
    absence_semantics: diagnostic
  - id: wh-review-provider
    kind: review
    doctor:
      - workflowhub-capability
      - wh-review-provider
    required_when: review
    absence_semantics: diagnostic
