stage: build-code
skills:
  - { name: test-routing-advisor, path: skills/test-routing-advisor/SKILL.md, execution: independent, trigger: every_behavior_phase_actual_scope, bundle: skills/test-routing-advisor/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#buildCodeContractFacts", inputs: ["contract_facts"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.contract_facts" } }
  - { name: backend-testing, path: skills/backend-testing/SKILL.md, execution: independent, trigger: actual_backend_test, bundle: skills/backend-testing/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#testFacts", inputs: ["receipts.tests"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.tests" } }
  - { name: frontend-testing, path: skills/frontend-testing/SKILL.md, execution: independent, trigger: actual_frontend_test, bundle: skills/frontend-testing/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#testFacts", inputs: ["receipts.tests"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.tests" } }
  - { name: frontend-component-quality, path: skills/frontend-component-quality/SKILL.md, execution: inline, trigger: actual_frontend_test, bundle: skills/frontend-component-quality/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#controlledBrowserQaFacts", inputs: ["contract_facts.component_quality_map"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.ui_qa" } }
  - { name: fullstack-slice-testing, path: skills/fullstack-slice-testing/SKILL.md, execution: independent, trigger: actual_fullstack_test, bundle: skills/fullstack-slice-testing/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#testFacts", inputs: ["receipts.tests"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.tests" } }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, trigger: review, bundle: skills/wh-review/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.review" } }
  - { name: spec-analyze, path: skills/spec-analyze/SKILL.md, execution: inline, trigger: stage_end_consistency, bundle: skills/spec-analyze/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#validateStageSpecAnalyzeOutcome", inputs: ["stage_outcome.spec_analyze"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_outcome.spec_analyze" } }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: diagnostic }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: diagnostic }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: phase_execution, absence_semantics: diagnostic }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: diagnostic }
  - { id: target-test-command, kind: command, doctor: [target-test-command, --version], required_when: always, absence_semantics: diagnostic }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: phase_execution, absence_semantics: diagnostic }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
