stage: build-code
skills:
  - name: knowledge-graph
    path: skills/knowledge-graph/SKILL.md
    trigger: phase_start_research_and_before_targeted_implementation
  - name: test-routing-advisor
    path: skills/test-routing-advisor/SKILL.md
    trigger: every_behavior_phase_actual_scope
  - name: backend-testing
    path: skills/backend-testing/SKILL.md
    trigger: actual_backend_test
  - name: frontend-testing
    path: skills/frontend-testing/SKILL.md
    trigger: actual_frontend_test
  - name: isolated-browser-qa
    path: skills/isolated-browser-qa/SKILL.md
    trigger: actual_browser_visible_phase_test
  - name: frontend-component-quality
    path: skills/frontend-component-quality/SKILL.md
    trigger: actual_frontend_test
  - name: fullstack-slice-testing
    path: skills/fullstack-slice-testing/SKILL.md
    trigger: actual_fullstack_test
  - name: spec-analyze
    path: skills/spec-analyze/SKILL.md
    trigger: stage_end_consistency
  - name: stage-handoff
    path: skills/stage-handoff/SKILL.md
    trigger: stage_end_human_handoff
  - name: wh-review
    path: skills/wh-review/SKILL.md
    # 每次代码审查先读 Long-review host convention；正常仍由 OCR 执行。
    trigger: every_code_review_invocation_method_only
  - name: architect-code-review
    path: skills/architect-code-review/SKILL.md
    trigger: every_phase_supplemental_review_not_heterologous
  - name: stage-reflection
    path: skills/stage-reflection/SKILL.md
    trigger: actual_stage_end_process_issue_optional
  - name: diagnosing-bugs
    path: skills/diagnosing-bugs/SKILL.md
    trigger: actual_failure_reproduction_before_hypothesis
  - name: norm-sync
    path: skills/norm-sync/SKILL.md
    trigger: every_phase_closeout_read_norm_sync_and_record_no_change_or_sync_change


runtime_capabilities:
  - id: node
    kind: cli
    version_policy: '>=24'
    doctor:
      - node
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: shell
    kind: cli
    doctor:
      - sh
      - '-c'
      - exit 0
    required_when: always
    absence_semantics: diagnostic
  - id: process
    kind: cli
    doctor:
      - ps
      - '-p'
      - '1'
    required_when: phase_execution
    absence_semantics: diagnostic
  - id: git
    kind: cli
    doctor:
      - git
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: target-test-command
    kind: command
    doctor:
      - target-test-command
      - '--version'
    required_when: always
    absence_semantics: diagnostic
external_capabilities:
  - id: graphify
    kind: cli
    doctor:
      - graphify
      - --help
    required_when: knowledge_graph_research
    absence_semantics: diagnostic
  - id: host-subagent
    kind: host
    doctor:
      - host-capability
      - host-subagent
    required_when: phase_execution
    absence_semantics: diagnostic
  - id: ocr-cli
    kind: cli
    version_policy: '>=1.12.9'
    doctor:
      - ocr
      - '--version'
    required_when: code_review
    absence_semantics: diagnostic
  - id: wh-review-provider
    kind: review
    doctor:
      - workflowhub-capability
      - wh-review-provider
    required_when: document_review
    absence_semantics: diagnostic
