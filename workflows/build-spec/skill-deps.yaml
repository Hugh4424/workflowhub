stage: build-spec
skills:
  - { name: spec-research, path: skills/spec-research/SKILL.md, execution: independent, trigger: conditional_research, bundle: skills/spec-research/skill-bundle.json, owner: stage }
  - { name: spec-clarify, path: skills/spec-clarify/SKILL.md, execution: inline, trigger: spec_ambiguity, bundle: skills/spec-clarify/skill-bundle.json, owner: stage }
  - { name: spec-specify, path: skills/spec-specify/SKILL.md, execution: inline, trigger: spec_draft, bundle: skills/spec-specify/skill-bundle.json, owner: stage }
  - { name: simplicity-guard, path: skills/simplicity-guard/SKILL.md, execution: inline, trigger: simplicity_check, bundle: skills/simplicity-guard/skill-bundle.json, owner: stage }
  - { name: plan-ceo-review, path: skills/plan-ceo-review/SKILL.md, execution: inline, trigger: product_direction_check, bundle: skills/plan-ceo-review/skill-bundle.json, owner: stage }
  - { name: plan-design-review, path: skills/plan-design-review/SKILL.md, execution: independent, trigger: ui_scope, bundle: skills/plan-design-review/skill-bundle.json, owner: stage }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, trigger: review, bundle: skills/wh-review/skill-bundle.json, owner: stage }
  - { name: spec-analyze, path: skills/spec-analyze/SKILL.md, execution: inline, trigger: stage_end_consistency, bundle: skills/spec-analyze/skill-bundle.json, owner: stage }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: diagnostic }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: diagnostic }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: diagnostic }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: review, absence_semantics: diagnostic }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: review, absence_semantics: diagnostic }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
