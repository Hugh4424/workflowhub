stage: build-spec
skills:
  - { name: spec-research, path: skills/spec-research/SKILL.md, execution: independent, trigger: conditional_research, bundle: skills/spec-research/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#testFacts", inputs: ["receipts.research"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.research" } }
  - { name: spec-clarify, path: skills/spec-clarify/SKILL.md, execution: inline, trigger: spec_ambiguity, bundle: skills/spec-clarify/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#testFacts", inputs: ["receipts.clarify"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.clarify" } }
  - { name: spec-specify, path: skills/spec-specify/SKILL.md, execution: inline, trigger: spec_draft, bundle: skills/spec-specify/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-spec\")", inputs: ["artifacts.spec.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.spec_ref" } }
  - { name: simplicity-guard, path: skills/simplicity-guard/SKILL.md, execution: inline, trigger: simplicity_check, bundle: skills/simplicity-guard/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.review" } }
  - { name: plan-ceo-review, path: skills/plan-ceo-review/SKILL.md, execution: inline, trigger: product_direction_check, bundle: skills/plan-ceo-review/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.review" } }
  - { name: ui-project-init, path: skills/ui-project-init/SKILL.md, execution: independent, trigger: ui_scope, bundle: skills/ui-project-init/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-spec\")", inputs: ["contract_facts.ui_project_init", "artifacts.spec.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.ui_project_init" } }
  - { name: design-source-readiness, path: skills/design-source-readiness/SKILL.md, execution: independent, trigger: ui_scope, bundle: skills/design-source-readiness/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-spec\")", inputs: ["contract_facts.design_source_readiness", "artifacts.spec.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.design_source_readiness" } }
  - { name: plan-design-review, path: skills/plan-design-review/SKILL.md, execution: independent, trigger: ui_scope, bundle: skills/plan-design-review/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"build-spec\")", inputs: ["contract_facts.plan_design_review", "artifacts.spec.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.plan_design_review" } }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, trigger: review, bundle: skills/wh-review/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.review" } }
  - { name: spec-analyze, path: skills/spec-analyze/SKILL.md, execution: inline, trigger: stage_end_consistency, bundle: skills/spec-analyze/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#validateStageSpecAnalyzeOutcome", inputs: ["stage_outcome.spec_analyze"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_outcome.spec_analyze" } }
  - { name: stage-reflection, path: skills/stage-reflection/SKILL.md, execution: inline, trigger: on_stage_end, bundle: skills/stage-reflection/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#runStageEndReflection", inputs: ["stage_outcome.step_outcomes", "stage_outcome.skill_outcomes"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_reflection" } }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: diagnostic }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: diagnostic }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: diagnostic }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: review, absence_semantics: diagnostic }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: review, absence_semantics: diagnostic }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
