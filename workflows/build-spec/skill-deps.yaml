stage: build-spec
skills:
  - { name: spec-specify, path: skills/spec-specify/SKILL.md, execution: inline, invocation: always, trigger: always, bundle: skills/spec-specify/skill-bundle.json }
  - { name: spec-clarify, path: skills/spec-clarify/SKILL.md, execution: inline, invocation: always, trigger: clarification, bundle: skills/spec-clarify/skill-bundle.json }
  - { name: simplicity-guard, path: skills/simplicity-guard/SKILL.md, execution: independent, invocation: always, trigger: scope_check, bundle: skills/simplicity-guard/skill-bundle.json }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, invocation: always, trigger: review, bundle: skills/wh-review/skill-bundle.json }
  - { name: plan-ceo-review, path: skills/plan-ceo-review/SKILL.md, execution: independent, invocation: conditional, trigger: wh_review_direction_lens, bundle: skills/plan-ceo-review/skill-bundle.json }
  - { name: review, path: skills/review/SKILL.md, execution: independent, invocation: conditional, trigger: wh_review_detail_lens, bundle: skills/review/skill-bundle.json }
  - { name: plan-design-review, path: skills/plan-design-review/SKILL.md, execution: independent, invocation: conditional, trigger: ui_scope, bundle: skills/plan-design-review/skill-bundle.json }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: blocked }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: review, absence_semantics: human_required }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
