stage: make-decision
skills:
  - { name: talk-with-zhipeng, path: skills/talk-with-zhipeng/SKILL.md, execution: inline, invocation: always, trigger: talk_round_1_2_3, bundle: skills/talk-with-zhipeng/skill-bundle.json, owner: stage, dispatch: stage }
  - { name: grill-with-docs, path: skills/grill-with-docs/SKILL.md, execution: inline, invocation: always, trigger: after_talk_round_3, bundle: skills/grill-with-docs/skill-bundle.json, owner: stage, dispatch: stage }
  - { name: decision-log, path: skills/decision-log/SKILL.md, execution: inline, invocation: always, trigger: decision_record, bundle: skills/decision-log/skill-bundle.json, owner: stage, dispatch: stage }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, invocation: always, trigger: review, bundle: skills/wh-review/skill-bundle.json, owner: stage, dispatch: stage }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: blocked }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: blocked }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: research_or_review, absence_semantics: blocked }
  - { id: git, kind: cli, doctor: [git, --version], required_when: implementation_selected, absence_semantics: blocked }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: research_or_review, absence_semantics: blocked }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
  - { id: muyu-search-mcp, kind: mcp, doctor: [host-capability, muyu-search-mcp], required_when: external_research_approved, absence_semantics: diagnostic }
  - { id: anysearch-api, kind: host, doctor: [workflowhub-capability, anysearch-api], required_when: external_research_approved, absence_semantics: diagnostic }
