stage: make-decision
skills:
  - name: talk-with-zhipeng
    path: skills/talk-with-zhipeng/SKILL.md
    trigger: dynamic_oi_driven_talk_batches
  - name: grill-with-docs
    path: skills/grill-with-docs/SKILL.md
    trigger: after_outline_talk
  - name: decision-log
    path: skills/decision-log/SKILL.md
    trigger: decision_record
  - name: deep-research
    path: skills/deep-research/SKILL.md
    trigger: proportionate_research
  - name: wh-review
    path: skills/wh-review/SKILL.md
    trigger: review
  - name: spec-analyze
    path: skills/spec-analyze/SKILL.md
    trigger: stage_end_consistency
  - name: stage-handoff
    path: skills/stage-handoff/SKILL.md
    trigger: stage_end_human_handoff
runtime_capabilities:
  - id: node
    kind: cli
    version_policy: '>=24'
    doctor:
      - node
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: shell
    kind: cli
    doctor:
      - sh
      - '-c'
      - exit 0
    required_when: always
    absence_semantics: diagnostic
  - id: process
    kind: cli
    doctor:
      - ps
      - '-p'
      - '1'
    required_when: research_or_review
    absence_semantics: diagnostic
  - id: git
    kind: cli
    doctor:
      - git
      - '--version'
    required_when: implementation_selected
    absence_semantics: diagnostic
external_capabilities:
  - id: ocr-cli
    kind: cli
    version_policy: '>=1.12.9'
    doctor:
      - ocr
      - '--version'
    required_when: code_review
    absence_semantics: diagnostic
  - id: host-subagent
    kind: host
    doctor:
      - host-capability
      - host-subagent
    required_when: research_or_review
    absence_semantics: diagnostic
  - id: wh-review-provider
    kind: review
    doctor:
      - workflowhub-capability
      - wh-review-provider
    required_when: review
    absence_semantics: diagnostic
  - id: muyu-search-mcp
    kind: mcp
    doctor:
      - host-capability
      - muyu-search-mcp
    required_when: external_research_approved
    absence_semantics: diagnostic
  - id: anysearch-api
    kind: host
    doctor:
      - workflowhub-capability
      - anysearch-api
    required_when: external_research_approved
    absence_semantics: diagnostic
  - id: web-fetch
    kind: host
    doctor:
      - workflowhub-capability
      - web-fetch
    required_when: external_research_approved
    absence_semantics: diagnostic
