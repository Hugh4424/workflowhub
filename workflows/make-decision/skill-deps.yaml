stage: make-decision
skills:
  # Review results use the actual canonical result ref, or unavailable attempt ref,
  # in receipts.direction_review / receipts.detail_review; safeReviewFacts authenticates them.
  # stage-reflection consumes the current authenticated outcome and v2 judgment.
  # Use its returned ref/sha256; <reflection_key> is a semantic key, not a raw hash.
  # A/A reuses the original; B writes a new ref; unavailable never implies success.
  - { name: talk-with-zhipeng, path: skills/talk-with-zhipeng/SKILL.md, execution: inline, trigger: talk_round_1_2_3_4_only, bundle: skills/talk-with-zhipeng/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#interactionAggregateFacts", inputs: ["receipts.interaction"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.interaction_aggregate" } }
  - { name: grill-with-docs, path: skills/grill-with-docs/SKILL.md, execution: inline, trigger: after_talk_round_3, bundle: skills/grill-with-docs/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#testFacts", inputs: ["receipts.grill"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.grill" } }
  - { name: decision-log, path: skills/decision-log/SKILL.md, execution: inline, trigger: decision_record, bundle: skills/decision-log/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#officialStageHandler(\"make-decision\")", inputs: ["artifacts.decision-log.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.decision_ref" } }
  - { name: deep-research, path: skills/deep-research/SKILL.md, execution: inline, trigger: proportionate_research, bundle: skills/deep-research/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#researchFacts", inputs: ["receipts.research", "research-report.v1.raw_bytes"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.research" } }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, trigger: review, bundle: skills/wh-review/skill-bundle.json, owner: stage, consumer: { target: "stage-handlers#safeReviewFacts", inputs: ["receipts.direction_review", "receipts.detail_review"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "facts.reviews" } }
  - { name: spec-analyze, path: skills/spec-analyze/SKILL.md, execution: inline, trigger: stage_end_consistency, bundle: skills/spec-analyze/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#validateStageSpecAnalyzeOutcome", inputs: ["stage_outcome.spec_analyze"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_outcome.spec_analyze" } }
  - { name: stage-reflection, path: skills/stage-reflection/SKILL.md, execution: inline, trigger: on_stage_end, bundle: skills/stage-reflection/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#runStageEndReflection", inputs: ["stage_outcome.producer", "stage_outcome.attempt_id", "stage_outcome.run_id", "stage_outcome.material_revision", "stage_outcome.snapshot_tree", "stage_outcome.step_outcomes", "stage_outcome.skill_outcomes"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_reflection" } }
  - { name: stage-handoff, path: skills/stage-handoff/SKILL.md, execution: inline, trigger: on_stage_end, bundle: skills/stage-handoff/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#runStageEndReflection", inputs: ["stage_outcome.producer", "stage_outcome.attempt_id", "stage_outcome.run_id", "stage_outcome.material_revision", "stage_outcome.snapshot_tree", "stage_outcome.step_outcomes", "stage_outcome.skill_outcomes", "artifacts.decision-log.md", "artifacts.spec.md", "artifacts.plan.md", "artifacts.tasks.md"], identity: ["task_id", "stage", "material_revision", "snapshot_tree"], result: "stage_handoff" } }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: diagnostic }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: diagnostic }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: research_or_review, absence_semantics: diagnostic }
  - { id: git, kind: cli, doctor: [git, --version], required_when: implementation_selected, absence_semantics: diagnostic }
external_capabilities:
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: research_or_review, absence_semantics: diagnostic }
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: review, absence_semantics: diagnostic }
  - { id: muyu-search-mcp, kind: mcp, doctor: [host-capability, muyu-search-mcp], required_when: external_research_approved, absence_semantics: diagnostic }
  - { id: anysearch-api, kind: host, doctor: [workflowhub-capability, anysearch-api], required_when: external_research_approved, absence_semantics: diagnostic }
  - { id: web-fetch, kind: host, doctor: [workflowhub-capability, web-fetch], required_when: external_research_approved, absence_semantics: diagnostic }
