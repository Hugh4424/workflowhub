stage: build-prd
skills:
  - name: knowledge-graph
    path: skills/knowledge-graph/SKILL.md
    trigger: stage_opening_and_existing_source_research
  - name: stage-closeout
    path: skills/stage-closeout/SKILL.md
    trigger: confirmed_final_prd_authorized_delivery_and_final_scope_cleanup
  - name: spec-prd
    path: skills/spec-prd/SKILL.md
    trigger: prd_outline_or_detail
  - name: stage-handoff
    path: skills/stage-handoff/SKILL.md
    trigger: stage_end_human_handoff
  - name: wh-review
    path: skills/wh-review/SKILL.md
    trigger: final_prd_document_review
  - name: stage-reflection
    path: skills/stage-reflection/SKILL.md
    trigger: actual_stage_end_process_issue_optional
runtime_capabilities:
  - id: node
    kind: cli
    version_policy: '>=24'
    doctor:
      - node
      - '--version'
    required_when: always
    absence_semantics: diagnostic
external_capabilities:
  - id: graphify
    kind: cli
    doctor:
      - graphify
      - '--help'
    required_when: internal_knowledge_research
    absence_semantics: diagnostic
  - id: wh-review-provider
    kind: review
    doctor:
      - workflowhub-capability
      - wh-review-provider
    required_when: document_review
    absence_semantics: diagnostic
