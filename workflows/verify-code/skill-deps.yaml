stage: verify-code
skills:
  - name: frontend-component-quality
    path: skills/frontend-component-quality/SKILL.md
    trigger: ui_acceptance
  - name: stage-handoff
    path: skills/stage-handoff/SKILL.md
    trigger: stage_end_human_handoff
  - name: wh-review
    path: skills/wh-review/SKILL.md
    # 每次代码审查先读 Long-review host convention；正常仍由 OCR 执行。architect 条目的条件回退仅按当前 workflows/verify-code/SKILL.md 的「## OCR 能力与回退」执行；该节目标经 P9 改为 architect-code-review 后才生效；已装失败、超时或取消均不回退。
    trigger: every_code_review_invocation_method_only
  - name: spec-analyze
    path: skills/spec-analyze/SKILL.md
    trigger: upstream_material_risk_read_only
  - name: architect-code-review
    path: skills/architect-code-review/SKILL.md
    trigger: '((ocr command does not exist (ENOENT) OR ocr version is below 1.12.9) AND current workflows/verify-code/SKILL.md section "## OCR 能力与回退" explicitly selects architect-code-review)'
  - name: stage-reflection
    path: skills/stage-reflection/SKILL.md
    trigger: actual_stage_end_process_issue_optional
runtime_capabilities:
  - id: node
    kind: cli
    version_policy: '>=24'
    doctor:
      - node
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: shell
    kind: cli
    doctor:
      - sh
      - '-c'
      - exit 0
    required_when: always
    absence_semantics: diagnostic
  - id: git
    kind: cli
    doctor:
      - git
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: target-test-command
    kind: command
    doctor:
      - target-test-command
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: browser-cli
    kind: cli
    doctor_any:
      - - agent-browser
        - '--version'
      - - browser-use
        - doctor
    required_when: ui_acceptance
    absence_semantics: diagnostic
external_capabilities:
  - id: ocr-cli
    kind: cli
    doctor:
      - ocr
      - '--version'
    required_when: code_review
    absence_semantics: diagnostic
    version_policy: '>=1.12.9'
  - id: wh-review-provider
    kind: review
    doctor:
      - workflowhub-capability
      - wh-review-provider
    required_when: ocr_missing_or_version_below_1_12_9_fallback
    absence_semantics: diagnostic
