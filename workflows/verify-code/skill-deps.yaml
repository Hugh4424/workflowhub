stage: verify-code
skills:
  - { name: frontend-component-quality, path: skills/frontend-component-quality/SKILL.md, execution: inline, trigger: ui_acceptance, bundle: skills/frontend-component-quality/skill-bundle.json, owner: stage, consumer: { target: "stage-content-contracts#validateComponentQualityMap", inputs: ["contract_facts.component_quality_map"], identity: ["task_id", "stage", "workspace_path"], result: "facts.component_quality" } }
  - { name: stage-reflection, path: skills/stage-reflection/SKILL.md, execution: inline, trigger: on_stage_end, bundle: skills/stage-reflection/skill-bundle.json, owner: stage, consumer: { target: "stage-runner#runStageEndReflection", inputs: ["artifacts.decision-log.md", "artifacts.spec.md", "artifacts.phases/index.md", "artifacts.phases/P<n>.md"], identity: ["task_id", "stage", "workspace_path"], result: "stage_reflection" } }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: diagnostic }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: diagnostic }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: diagnostic }
  - { id: target-test-command, kind: command, doctor: [target-test-command, --version], required_when: always, absence_semantics: diagnostic }
  - { id: browser-cli, kind: cli, doctor_any: [[agent-browser, --version], [browser-use, doctor]], required_when: ui_acceptance, absence_semantics: diagnostic }
external_capabilities:
  - { id: ocr-cli, kind: cli, doctor: [ocr, --version], required_when: code_review, absence_semantics: diagnostic }
