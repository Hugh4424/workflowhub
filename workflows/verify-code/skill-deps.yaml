stage: verify-code
skills:
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, invocation: always, trigger: fresh_verification_evidence, bundle: skills/wh-review/skill-bundle.json }
  - { name: resolving-merge-conflicts, path: skills/resolving-merge-conflicts/SKILL.md, execution: inline, invocation: conditional, trigger: close_merge_conflict, bundle: skills/resolving-merge-conflicts/skill-bundle.json }
  - { name: test-strategy, path: skills/test-strategy/SKILL.md, execution: independent, invocation: conditional, trigger: accepted_test_routing_requires_strategy, bundle: skills/test-strategy/skill-bundle.json }
  - { name: isolated-browser-qa, path: skills/isolated-browser-qa/SKILL.md, execution: independent, invocation: conditional, trigger: ui_acceptance, bundle: skills/isolated-browser-qa/skill-bundle.json }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: blocked }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: blocked }
  - { id: process, kind: cli, doctor: [ps, -p, "1"], required_when: test_strategy_or_ui, absence_semantics: blocked }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: blocked }
  - { id: target-test-command, kind: command, doctor: [target-test-command, --version], required_when: always, absence_semantics: blocked }
  - { id: browser-cli, kind: cli, doctor_any: [[agent-browser, --version], [browser-use, doctor]], required_when: ui_acceptance, absence_semantics: blocked }
external_capabilities:
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: fresh_verification_evidence, absence_semantics: diagnostic }
  - { id: host-subagent, kind: host, doctor: [host-capability, host-subagent], required_when: test_strategy_or_ui, absence_semantics: diagnostic }
