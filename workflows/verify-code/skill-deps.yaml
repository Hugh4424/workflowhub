stage: verify-code
skills:
  - { name: dsh-code-review, path: skills/dsh-code-review/SKILL.md, execution: inline, trigger: code_review, bundle: skills/dsh-code-review/skill-bundle.json, owner: stage }
  - { name: frontend-component-quality, path: skills/frontend-component-quality/SKILL.md, execution: inline, trigger: ui_acceptance, bundle: skills/frontend-component-quality/skill-bundle.json, owner: stage }
  - { name: wh-review, path: skills/wh-review/SKILL.md, execution: inline, trigger: post_first_repair, bundle: skills/wh-review/skill-bundle.json, owner: stage }
runtime_capabilities:
  - { id: node, kind: cli, version_policy: ">=24", doctor: [node, --version], required_when: always, absence_semantics: diagnostic }
  - { id: shell, kind: cli, doctor: [sh, -c, "exit 0"], required_when: always, absence_semantics: diagnostic }
  - { id: git, kind: cli, doctor: [git, --version], required_when: always, absence_semantics: diagnostic }
  - { id: target-test-command, kind: command, doctor: [target-test-command, --version], required_when: always, absence_semantics: diagnostic }
  - { id: browser-cli, kind: cli, doctor_any: [[agent-browser, --version], [browser-use, doctor]], required_when: ui_acceptance, absence_semantics: diagnostic }
external_capabilities:
  - { id: wh-review-provider, kind: review, doctor: [workflowhub-capability, wh-review-provider], required_when: code_review, absence_semantics: diagnostic }
