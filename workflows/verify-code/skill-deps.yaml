stage: verify-code
skills:
  - name: knowledge-graph
    path: skills/knowledge-graph/SKILL.md
    trigger: stage_opening_and_inspect_real_entry_and_tests
  - name: stage-close
    path: skills/stage-close/SKILL.md
    trigger: authorized_verification_delivery_and_final_scope_cleanup
  - name: isolated-browser-qa
    path: skills/isolated-browser-qa/SKILL.md
    trigger: browser_visible_acceptance
  - name: frontend-component-quality
    path: skills/frontend-component-quality/SKILL.md
    trigger: ui_acceptance
  - name: stage-handoff
    path: skills/stage-handoff/SKILL.md
    trigger: stage_end_human_handoff
  - name: wh-review
    path: skills/wh-review/SKILL.md
    # 每次代码审查先读 Long-review host convention；正常仍由 OCR 执行。
    trigger: every_code_review_invocation_method_only
  - name: spec-analyze
    path: skills/spec-analyze/SKILL.md
    trigger: upstream_material_risk_read_only
  - name: architect-code-review
    path: skills/architect-code-review/SKILL.md
    trigger: every_terminal_code_review_same_source_supplemental_axis
  - name: stage-reflection
    path: skills/stage-reflection/SKILL.md
    trigger: actual_stage_end_process_issue_optional
  - name: norm-sync
    path: skills/norm-sync/SKILL.md
    trigger: terminal_closeout_read_norm_sync_and_record_no_change_or_sync_change


  - name: design-source-extraction
    path: skills/design-source-extraction/SKILL.md
    trigger: ui_scope_readable_design_source_extraction

runtime_capabilities:
  - id: node
    kind: cli
    version_policy: '>=24'
    doctor:
      - node
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: shell
    kind: cli
    doctor:
      - sh
      - '-c'
      - exit 0
    required_when: always
    absence_semantics: diagnostic
  - id: git
    kind: cli
    doctor:
      - git
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: target-test-command
    kind: command
    doctor:
      - target-test-command
      - '--version'
    required_when: always
    absence_semantics: diagnostic
  - id: browser-cli
    kind: cli
    doctor_any:
      - - agent-browser
        - '--version'
      - - browser-use
        - doctor
    required_when: ui_acceptance
    absence_semantics: diagnostic
external_capabilities:
  - id: graphify
    kind: cli
    doctor:
      - graphify
      - '--help'
    required_when: internal_knowledge_research_or_closeout_update
    absence_semantics: diagnostic
  - id: ocr-cli
    kind: cli
    doctor:
      - ocr
      - '--version'
    required_when: code_review
    absence_semantics: diagnostic
    version_policy: '>=1.12.9'
  - id: wh-review-provider
    kind: review
    doctor:
      - workflowhub-capability
      - wh-review-provider
    required_when: document_review
    absence_semantics: diagnostic
